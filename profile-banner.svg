  <ellipse cx="970" cy="120" rx="340" ry="230" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="2">
    <path d="M690 57H815L875 117H1035L1105 47"/>
    <path d="M740 155H835L900 90H1005L1070 155H1165"/>
    <path d="M700 240H820L885 175H1025L1090 240H1180"/>
    <path d="M930 25V74M985 155V205M1115 155V215"/>
    <path d="M820 57V118M900 175V240"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="690" cy="57" r="5"/><circle cx="815" cy="57" r="5"/>
    <circle cx="875" cy="117" r="5"/><circle cx="1035" cy="117" r="5"/>
    <circle cx="1105" cy="47" r="5"/><circle cx="740" cy="155" r="5"/>
    <circle cx="900" cy="90" r="5"/><circle cx="1070" cy="155" r="5"/>
    <circle cx="1165" cy="155" r="5"/><circle cx="700" cy="240" r="5"/>
