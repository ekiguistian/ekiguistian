  <text x="74" y="158" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="750">Welcome to Little ant - Bro Ek</text>
  <text x="78" y="204" fill="#C7D2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Jaringan, DNS, server, dan aplikasi web—dirangkai satu per satu.</text>
  <rect x="78" y="236" width="150" height="5" rx="2.5" fill="url(#accent)"/>
